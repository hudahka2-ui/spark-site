, "f": "8 × 9 = 72. Eights are double the fours."}, {"t": "6 × 8 = ?", "o": ["54", "48", "49"], "c": 1, "f": "6 × 8 = 48. Eights are double the fours."}, {"t": "8 × 8 = ?", "o": ["64", "56", "72"], "c": 0, "f": "8 × 8 = 64. Eights are double the fours."}, {"t": "3 × 8 = ?", "o": ["24", "23", "34"], "c": 0, "f": "3 × 8 = 24. Eights are double the fours."}]}, {"id": "s8", "em": "🗼", "c": "#C0392B", "name": "8. Tower of Nines", "sub": "Tables 9", "q": [{"t": "10 × 9 = ?", "o": ["90", "99", "81"], "c": 0, "f": "10 × 9 = 90. Trick for nines up to 90: the digits of the answer add up to 9."}, {"t": "4 × 9 = ?", "o": ["32", "36", "37"], "c": 1, "f": "4 × 9 = 36. Trick for nines up to 90: the digits of the answer add up to 9."}, {"t": "9 × 6 = ?", "o": ["54", "60", "55"], "c": 0, "f": "9 × 6 = 54. Trick for nines up to 90: the digits of the answer add up to 9."}, {"t": "3 × 9 = ?", "o": ["18", "28", "27"], "c": 2, "f": "3 × 9 = 27. Trick for nines up to 90: the digits of the answer add up to 9."}, {"t": "9 × 4 = ?", "o": ["36", "37", "40"], "c": 0, "f": "9 × 4 = 36. Trick for nines up to 90: the digits of the answer add up to 9."}]}, {"id": "s9", "em": "🏝️", "c": "#E0559B", "name": "9. Treasure Island", "sub": "All tables", "q": [{"t": "6 × 6 = ?", "o": ["36", "35", "42"], "c": 0, "f": "6 × 6 = 36. Sixes are double the threes."}, {"t": "3 × 2 = ?", "o": ["6", "5", "8"], "c": 0, "f": "3 × 2 = 6. Count up in threes: 3, 6, 9, 12…"}, {"t": "9 × 9 = ?", "o": ["81", "91", "80"], "c": 0, "f": "9 × 9 = 81. Trick for nines up to 90: the digits of the answer add up to 9."}, {"t": "7 × 7 = ?", "o": ["42", "48", "49"], "c": 2, "f": "7 × 7 = 49. Sevens are a little harder: take your time!"}, {"t": "3 × 3 = ?", "o": ["12", "19", "9"], "c": 2, "f": "3 × 3 = 9. Count up in threes: 3, 6, 9, 12…"}]}], TOTAL=ST.reduce((n,s)=>n+s.q.length,0);

function map(){app.innerHTML='';if(HERO){const im=el('img','hero');im.src=HERO;im.alt=HEROALT;app.append(im)}
